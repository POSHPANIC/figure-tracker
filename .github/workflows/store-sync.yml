name: Daily store sync

# Keep the manufacturer store links on figure pages true.
#
# Three things drift and all of them are visible to a reader:
#
#   new products      Kotobukiya announces figures the catalogue does not have
#   prices            a preorder price changes, or a figure sells out
#   withdrawn products the store link starts leading to a 404
#
# The last one is the reason this runs daily rather than monthly. A dead link on
# a figure page is worse than no link — that is what sank the first attempt at
# Good Smile store links, and it was a visitor who noticed, not us.
#
# Cheap by design. Kotobukiya's whole catalogue is six requests to Shopify's
# public products.json, and a product page is only fetched for a figure we have
# never seen. A quiet night costs six requests and no page loads.

on:
  schedule:
    # 03:00 UTC, an hour before the Vercel ingest cron at 04:00 and two before
    # the listing sweep at 05:00. Nothing here competes with those for eBay
    # quota — it does not touch eBay — but staggering keeps the logs readable
    # and keeps three jobs off the same database at once.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  # Two syncs at once would race on the same rows and ask the same store the
  # same questions twice.
  group: store-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Measured at well under five minutes when nothing is new. The ceiling is
    # for the case where they add a lot at once and every new product needs its
    # page read at ~0.7s each.
    # 30 killed the run twice in September once the shop-offer writes were
    # added. The work itself is ~22 minutes; this is margin, not headroom to
    # grow into.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # New products, refreshed prices and availability, and store links cleared
      # for anything the store no longer lists. Refuses to delist when the index
      # comes back empty, since that is far more likely to be a failed fetch
      # than every product vanishing at once.
      - name: Sync Kotobukiya
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run import:kotobukiya -- --yes

      # Import a retailer's catalogue outright. Products already held are
      # refreshed for price and stock; the rest are attached to a figure we hold
      # or created, decided on exact identifiers alone.
      #
      # This replaced a discover-then-review pair. The review half never
      # happened: 27 products a night were parked as "left for review" and not
      # one was ever looked at again, so the queue was losing them rather than
      # holding them. See scripts/import-solaris.ts.
      - name: Sync Solaris
        if: always()
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run import:solaris -- --yes --pages 8 --max 60

      # Nin-Nin Game, same shape as Solaris. Their pages carry the JAN on
      # every product, so attaching is exact here — and each run records
      # barcodes against figures that had none, which is what makes every
      # later source easier to match.
      #
      # Store links only fill a gap: they run no affiliate programme, so
      # overwriting a tagged Solaris link with one that cannot earn would
      # cost money on every figure both shops stock.
      - name: Sync Nin-Nin Game
        if: always()
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run import:ninnin -- --yes --max 60

      # HobbyLink Japan. The most cooperative of the retailers: robots.txt
      # allows everything but accounts, they answer a plain request rather than
      # a browser fingerprint, and every product carries a JAN. The first real
      # run attached 44 of 50 to figures already held on that barcode alone.
      #
      # Their price is in yen and is their own, discounted, so it goes to a
      # ShopOffer and never to msrpAmount. They run an affiliate programme at
      # hlj.com/affiliate-program; links are stored clean either way.
      - name: Sync HobbyLink Japan
        if: always()
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run import:hlj -- --yes --pages 2 --max 50

      # A slice of Good Smile's shop, for barcodes.
      #
      # Their archive built most of this catalogue and publishes no barcode at
      # all; their shop publishes one on every product. Nothing joins the two —
      # different id spaces, no cross-links, and the shop's only listing route
      # is /en/search, which their robots.txt disallows — so this walks product
      # ids and matches on an exact name plus manufacturer.
      #
      # The first sweep is done: ids 1–13,424, and 4,400 barcodes. What this
      # keeps doing is catching new releases, which the shop adds at the top of
      # the id range. On reaching the end the cursor rewinds to just behind the
      # last live product, so each night re-walks a short tail and then carries
      # on into whatever is new.
      - name: Recover barcodes from Good Smile
        if: always()
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        # 200, not 400. The sweep finished weeks ago and this is now only
        # watching the tail for new releases: the cursor rewinds 120 ids behind
        # the last live product, so 200 covers it with headroom and the rest was
        # fifteen minutes of walking empty ids for nothing.
        run: npm run backfill:goodsmile -- --write --max 200

      # One slice of HobbySearch. Unlike the other sources this creates figures
      # directly, because it has what a review queue exists to establish: a JAN
      # barcode proving the figure is not already listed, and the manufacturer's
      # own list price in yen rather than a shop's marked-up one.
      #
      # Ten products a night, a minute apart. They rate-limit hard — see the
      # note in the script — and the run stops itself if they ask it to. The
      # slice advances by date, so the store is covered over weeks.
      - name: Rotate through HobbySearch
        if: always()
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run discover:hobbysearch -- --yes

      # New figures — from either source above — arrive with series the curated
      # list has never seen, and browsing is by franchise, so a series without
      # one is unreachable. Once at the end rather than after each source: it is
      # a full pass over the catalogue and twice a night buys nothing.
      - name: File any new series
        if: always()
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run assign:franchises -- --yes

      # Good Smile's links are refreshed separately because their store cannot
      # be enumerated: there is no index to compare against, so each stored page
      # is re-read to see whether its order window has closed. Only one figure
      # has such a link today, so this is one request.
      - name: Refresh Good Smile store pages
        if: always()
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run check:store -- --refresh --yes
