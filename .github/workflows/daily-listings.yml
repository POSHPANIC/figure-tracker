name: Daily listing refresh

# Refresh eBay listings across the catalogue, once a day.
#
# This does not run on Vercel because it cannot: a sweep is far longer than a
# serverless function may live. The site's own cron still runs a small batch at
# 04:00 UTC; this is the bulk pass an hour later, once that has had its turn and
# the daily quota has reset.
#
# 2,000 figures a run, not the whole catalogue. Polling everything daily was
# costing 150 minutes and being killed before it finished, and it was never
# necessary: lib/ingest/poll-priority.ts ranks figures by who owns, wants and
# reads them, so the ones anybody is watching still come round every day and the
# long tail comes round slower. A shorter sweep that completes beats a longer
# one that does not.
#
# Listings genuinely go stale — they sell, expire, get relisted — so a figure
# page showing last week's prices is showing the wrong thing. That is the
# reason this exists; the call volume follows from it.
#
# Prices only. This used to look for missing figures too, by reading release
# numbers out of listings it could not attach to anything. Solaris does that
# job better: a product page with a barcode, a full release date and specs,
# against a seller's shorthand that a person then had to name by hand. See
# .github/workflows/store-sync.yml.

on:
  schedule:
    # 05:00 UTC daily. After the Vercel cron at 04:00, and early enough that a
    # ninety-minute run finishes well inside the same quota day.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      total:
        description: "How many figures to poll"
        required: false
        default: "2000"

concurrency:
  # Never two sweeps at once. They would spend double the quota and race each
  # other for the same figures, and the second would add nothing the first
  # had not already done.
  group: daily-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Sized to finish, not to be survived. At ~12 minutes per 500 figures a
    # 2,000-figure sweep is around 50 minutes; 75 leaves room for a slow night
    # and still fails fast instead of billing 150 minutes before being killed.
    #
    # It used to be 150 against a 4,800-figure sweep that the comment called
    # ninety minutes. The catalogue outgrew that, and six of ten runs were
    # killed mid-sweep — maximum cost for incomplete work.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Refresh listings
        env:
          # The direct Neon endpoint, not the pooled one — same reason
          # migrations need it, and this run holds long connections.
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          # Not a secret, and holding it as one was actively harmful: GitHub
          # masks every occurrence of a secret's value in the logs, and this
          # value is the word "production". The flag came out as "--***" and
          # the target database as "(***)", which is exactly the detail you
          # open the log to check.
          EBAY_ENV: production
        run: |
          npm run backfill:listings -- \
            --production \
            --total "${{ github.event.inputs.total || '2000' }}" \
            --batch 500
